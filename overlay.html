<!DOCTYPE html>
<!-- always over a dimmed frozen frame, so the glass chrome is pinned dark -->
<html data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="theme-soft-round.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: #000; }
  #shot { position: absolute; inset: 0; width: 100%; height: 100%; }
  #dim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.35); }
  #sel {
    position: absolute;
    display: none;
    border: 1px solid var(--sp-accent);
    background: transparent;
    box-shadow: 0 0 0 100000px rgba(0, 0, 0, 0.35);
  }
  #size {
    position: absolute;
    display: none;
    background: var(--sp-glass-bg);
    backdrop-filter: blur(var(--sp-glass-blur));
    -webkit-backdrop-filter: blur(var(--sp-glass-blur));
    border: 1px solid var(--sp-glass-border);
    box-shadow: var(--sp-glass-shadow), var(--sp-glass-highlight);
    color: var(--sp-glass-text);
    font: 12px var(--sp-font-mono);
    font-variant-numeric: tabular-nums;
    padding: 4px 12px;
    border-radius: var(--sp-radius-full);
    pointer-events: none;
    white-space: nowrap;
  }
  #hint {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--sp-glass-bg);
    backdrop-filter: blur(var(--sp-glass-blur));
    -webkit-backdrop-filter: blur(var(--sp-glass-blur));
    border: 1px solid var(--sp-glass-border);
    box-shadow: var(--sp-glass-shadow), var(--sp-glass-highlight);
    color: var(--sp-glass-text);
    font: 13px var(--sp-font-ui);
    padding: 7px 16px;
    border-radius: var(--sp-radius-full);
    pointer-events: none;
  }
</style>
</head>
<body>
<img id="shot" draggable="false" />
<div id="dim"></div>
<div id="sel"></div>
<div id="size"></div>
<div id="hint">Drag to select an area &nbsp;·&nbsp; Esc to cancel</div>
<script>
  const { ipcRenderer } = require('electron');
  const displayId = new URLSearchParams(location.search).get('displayId');

  ipcRenderer.invoke('overlay-get-image', displayId).then((res) => {
    if (res) document.getElementById('shot').src = res.dataUrl;
  });

  const sel = document.getElementById('sel');
  const dim = document.getElementById('dim');
  const sizeBadge = document.getElementById('size');
  const hint = document.getElementById('hint');
  let dragging = false;
  let sx = 0, sy = 0;

  function rectFrom(e) {
    const x = Math.min(sx, e.clientX);
    const y = Math.min(sy, e.clientY);
    const w = Math.abs(e.clientX - sx);
    const h = Math.abs(e.clientY - sy);
    return { x, y, w, h };
  }

  window.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    sx = e.clientX;
    sy = e.clientY;
    hint.style.display = 'none';
    dim.style.display = 'none';
    sel.style.display = 'block';
    update(rectFrom(e));
  });

  function update(r) {
    sel.style.left = r.x + 'px';
    sel.style.top = r.y + 'px';
    sel.style.width = r.w + 'px';
    sel.style.height = r.h + 'px';
    sizeBadge.style.display = 'block';
    sizeBadge.textContent = r.w + ' × ' + r.h;
    const bx = Math.min(r.x, window.innerWidth - 130);
    const by = r.y + r.h + 8 < window.innerHeight - 36 ? r.y + r.h + 8 : r.y - 34;
    sizeBadge.style.left = bx + 'px';
    sizeBadge.style.top = Math.max(4, by) + 'px';
  }

  window.addEventListener('mousemove', (e) => {
    if (dragging) update(rectFrom(e));
  });

  window.addEventListener('mouseup', (e) => {
    if (!dragging || e.button !== 0) return;
    dragging = false;
    const r = rectFrom(e);
    if (r.w < 3 || r.h < 3) {
      ipcRenderer.send('overlay-cancel');
      return;
    }
    ipcRenderer.send('overlay-selected', { displayId, rect: r });
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') ipcRenderer.send('overlay-cancel');
  });
</script>
</body>
</html>
