<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>SCR-OCR</title>
<link rel="stylesheet" href="theme-soft-round.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    user-select: none;
  }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
  #capture { height: 40px; padding: 0 24px; font-size: 14px; }
  /* delay presets and the countdown swap in place, so the layout never jumps */
  .delay-row { height: 28px; display: flex; align-items: center; gap: 6px; }
  .delay-row[hidden] { display: none; }
  .delay-label { font-size: 12px; color: var(--sp-muted); margin-right: 2px; }
  .delay-btn { height: 28px; padding: 0 10px; font-size: 12px; }
  #countdown-text { font-size: 13px; font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: var(--sp-muted); text-align: center; line-height: 1.8; }
  kbd {
    background: var(--sp-surface);
    border: 1px solid var(--sp-border-strong);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 7px;
    font-family: var(--sp-font-mono);
    font-size: 11px;
  }
</style>
</head>
<body class="sp-body">
<h1>SCR-OCR</h1>
<button id="capture" class="sp-btn">Take screenshot</button>
<div id="delays" class="delay-row">
  <span class="delay-label">or after</span>
  <button class="sp-btn delay-btn" data-seconds="1">1s</button>
  <button class="sp-btn delay-btn" data-seconds="2">2s</button>
  <button class="sp-btn delay-btn" data-seconds="3">3s</button>
  <button class="sp-btn delay-btn" data-seconds="5">5s</button>
  <button class="sp-btn delay-btn" data-seconds="10">10s</button>
</div>
<div id="countdown" class="delay-row" hidden>
  <span id="countdown-text"></span>
  <button id="countdown-cancel" class="sp-btn delay-btn">Cancel</button>
</div>
<div class="hint">
  Global hotkey: <kbd>PrtSc</kbd><br />
  Closing this window keeps SCR-OCR running in the tray.
</div>
<script>
  const { ipcRenderer } = require('electron');
  document.getElementById('capture').addEventListener('click', () => {
    ipcRenderer.send('start-capture');
  });
  for (const btn of document.querySelectorAll('.delay-btn[data-seconds]')) {
    btn.addEventListener('click', () => {
      ipcRenderer.send('start-capture-delayed', Number(btn.dataset.seconds));
    });
  }
  document.getElementById('countdown-cancel').addEventListener('click', () => {
    ipcRenderer.send('cancel-delayed-capture');
  });
  // main broadcasts the remaining seconds once per second; 0 means no delay
  // is pending (fired or cancelled) — show the presets again
  ipcRenderer.on('delay-tick', (e, remaining) => {
    const pending = remaining > 0;
    document.getElementById('delays').hidden = pending;
    document.getElementById('countdown').hidden = !pending;
    if (pending)
      document.getElementById('countdown-text').textContent = `Capturing in ${remaining}s…`;
  });
</script>
</body>
</html>
