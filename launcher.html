<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>SCR-OCR</title>
<link rel="stylesheet" href="theme-soft-round.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 16px 0;
    gap: 14px;
    user-select: none;
  }
  .hint { margin-top: auto; }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
  /* the capture row and the countdown swap in place (equal heights), so the
     layout never jumps */
  .row { height: 40px; display: flex; align-items: center; gap: 8px; }
  .row[hidden] { display: none; }
  #capture { height: 40px; padding: 0 22px; font-size: 14px; }
  /* split button: "After Ns" fires the delayed capture, the chevron opens the
     preset menu; fixed width so the label change (1s ↔ 10s) doesn't shift it */
  .split { display: flex; width: 124px; height: 40px; }
  .split-main {
    flex: 1;
    height: 40px;
    padding: 0 0 0 14px;
    font-size: 13px;
    justify-content: flex-start;
    border-radius: var(--sp-radius-full) 0 0 var(--sp-radius-full);
    border-right: none;
  }
  .split-toggle {
    width: 30px;
    height: 40px;
    padding: 0 4px 0 0;
    font-size: 10px;
    border-radius: 0 var(--sp-radius-full) var(--sp-radius-full) 0;
    border-left: 1px solid var(--sp-border);
  }
  #countdown-text { font-size: 13px; font-variant-numeric: tabular-nums; }
  #countdown-cancel { height: 32px; padding: 0 14px; font-size: 12px; }
  .hint { font-size: 12px; color: var(--sp-muted); text-align: center; line-height: 1.8; }
  kbd {
    background: var(--sp-surface);
    border: 1px solid var(--sp-border-strong);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 7px;
    font-family: var(--sp-font-mono);
    font-size: 11px;
  }
</style>
</head>
<body class="sp-body">
<h1>SCR-OCR</h1>
<div id="capture-row" class="row">
  <button id="capture" class="sp-btn">Take screenshot</button>
  <div class="split">
    <button id="delay-main" class="sp-btn sp-btn--outline split-main"></button>
    <button id="delay-toggle" class="sp-btn sp-btn--outline split-toggle"
            aria-haspopup="menu" aria-label="Choose delay">&#9662;</button>
  </div>
</div>
<div id="countdown" class="row" hidden>
  <span id="countdown-text"></span>
  <button id="countdown-cancel" class="sp-btn sp-btn--outline">Cancel</button>
</div>
<div class="hint">
  Global hotkey: <kbd>PrtSc</kbd><br />
  Closing this window keeps SCR-OCR running in the tray.
</div>
<script>
  const { ipcRenderer } = require('electron');
  const DELAYS = [1, 2, 3, 5, 10]; // keep in sync with DELAYS in main.js

  // last-used delay is the split button's default, remembered across runs
  let delay = Number(localStorage.getItem('delay-seconds'));
  if (!DELAYS.includes(delay)) delay = 1;

  const mainBtn = document.getElementById('delay-main');
  const renderDelay = () => { mainBtn.textContent = `After ${delay}s`; };
  renderDelay();

  document.getElementById('capture').addEventListener('click', () => {
    ipcRenderer.send('start-capture');
  });
  mainBtn.addEventListener('click', () => {
    ipcRenderer.send('start-capture-delayed', delay);
  });
  // the preset list is a native popup menu (built in main) so it can extend
  // past the window's edges — a DOM dropdown would be clipped by the compact
  // window. Anchored to the split button's bottom-left.
  const split = document.querySelector('.split');
  document.getElementById('delay-toggle').addEventListener('click', () => {
    const r = split.getBoundingClientRect();
    ipcRenderer.send('show-delay-menu', {
      x: Math.round(r.left),
      y: Math.round(r.bottom + 4),
      current: delay,
    });
  });
  // main echoes the delay picked in the popup so the split button remembers it
  ipcRenderer.on('delay-selected', (e, s) => {
    delay = s;
    localStorage.setItem('delay-seconds', String(s));
    renderDelay();
  });
  document.getElementById('countdown-cancel').addEventListener('click', () => {
    ipcRenderer.send('cancel-delayed-capture');
  });
  // main broadcasts the remaining seconds once per second; 0 means no delay
  // is pending (fired or cancelled) — show the capture buttons again
  ipcRenderer.on('delay-tick', (e, remaining) => {
    const pending = remaining > 0;
    document.getElementById('capture-row').hidden = pending;
    document.getElementById('countdown').hidden = !pending;
    if (pending) {
      document.getElementById('countdown-text').textContent = `Capturing in ${remaining}s…`;
    }
  });
</script>
</body>
</html>
