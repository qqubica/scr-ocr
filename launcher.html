<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>SCR-OCR</title>
<link rel="stylesheet" href="theme-soft-round.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    user-select: none;
  }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
  #capture { height: 40px; padding: 0 24px; font-size: 14px; }
  .hint { font-size: 12px; color: var(--sp-muted); text-align: center; line-height: 1.8; }
  kbd {
    background: var(--sp-surface);
    border: 1px solid var(--sp-border-strong);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 7px;
    font-family: var(--sp-font-mono);
    font-size: 11px;
  }
</style>
</head>
<body class="sp-body">
<h1>SCR-OCR</h1>
<button id="capture" class="sp-btn">Take screenshot</button>
<div class="hint">
  Global hotkey: <kbd>PrtSc</kbd><br />
  Closing this window keeps SCR-OCR running in the tray.
</div>
<script>
  const { ipcRenderer } = require('electron');
  document.getElementById('capture').addEventListener('click', () => {
    ipcRenderer.send('start-capture');
  });
</script>
</body>
</html>
