<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>SCR-OCR</title>
<link rel="stylesheet" href="theme-soft-round.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* content sits at the top and the hint is pinned to the bottom — the space
     between is where the delay menu drops down without clipping the window */
  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 0;
    gap: 16px;
    user-select: none;
  }
  .hint { margin-top: auto; }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
  /* the capture row and the countdown swap in place (equal heights), so the
     layout never jumps */
  .row { height: 40px; display: flex; align-items: center; gap: 8px; }
  .row[hidden] { display: none; }
  #capture { height: 40px; padding: 0 22px; font-size: 14px; }
  /* split button: "After Ns" fires the delayed capture, the chevron opens the
     preset menu; fixed width so the label change (1s ↔ 10s) doesn't shift it */
  .split { position: relative; display: flex; width: 124px; height: 40px; }
  .split-main {
    flex: 1;
    height: 40px;
    padding: 0 0 0 14px;
    font-size: 13px;
    justify-content: flex-start;
    border-radius: var(--sp-radius-full) 0 0 var(--sp-radius-full);
    border-right: none;
  }
  .split-toggle {
    width: 30px;
    height: 40px;
    padding: 0 4px 0 0;
    font-size: 10px;
    border-radius: 0 var(--sp-radius-full) var(--sp-radius-full) 0;
    border-left: 1px solid var(--sp-border);
  }
  /* the preset menu drops down from the split button; the window height and
     the top-anchored layout leave just enough room below for all five items */
  .menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 100%;
    background: var(--sp-surface);
    border: 1px solid var(--sp-border-strong);
    border-radius: var(--sp-radius-tool);
    padding: 4px;
    box-shadow: var(--sp-shadow-card);
    z-index: 10;
    animation: menu-in var(--sp-dur-enter) var(--sp-ease-spring);
  }
  .menu[hidden] { display: none; }
  @keyframes menu-in {
    from { opacity: 0; transform: translateY(-6px) scale(0.97); }
  }
  .menu button {
    display: block;
    width: 100%;
    padding: 5px 12px;
    border: none;
    border-radius: 10px;
    background: none;
    color: var(--sp-text);
    font-family: var(--sp-font-ui);
    font-size: 12.5px;
    text-align: left;
    cursor: pointer;
  }
  .menu button:hover { background: var(--sp-hover-strong); }
  .menu button.current { background: var(--sp-accent-tint); }
  .menu button:focus-visible { outline: 2px solid var(--sp-accent); outline-offset: -2px; }
  #countdown-text { font-size: 13px; font-variant-numeric: tabular-nums; }
  #countdown-cancel { height: 32px; padding: 0 14px; font-size: 12px; }
  .hint { font-size: 12px; color: var(--sp-muted); text-align: center; line-height: 1.8; }
  kbd {
    background: var(--sp-surface);
    border: 1px solid var(--sp-border-strong);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 7px;
    font-family: var(--sp-font-mono);
    font-size: 11px;
  }
</style>
</head>
<body class="sp-body">
<h1>SCR-OCR</h1>
<div id="capture-row" class="row">
  <button id="capture" class="sp-btn">Take screenshot</button>
  <div class="split">
    <button id="delay-main" class="sp-btn sp-btn--outline split-main"></button>
    <button id="delay-toggle" class="sp-btn sp-btn--outline split-toggle"
            aria-haspopup="menu" aria-label="Choose delay">&#9662;</button>
    <div id="delay-menu" class="menu" role="menu" hidden></div>
  </div>
</div>
<div id="countdown" class="row" hidden>
  <span id="countdown-text"></span>
  <button id="countdown-cancel" class="sp-btn sp-btn--outline">Cancel</button>
</div>
<div class="hint">
  Global hotkey: <kbd>PrtSc</kbd><br />
  Closing this window keeps SCR-OCR running in the tray.
</div>
<script>
  const { ipcRenderer } = require('electron');
  const DELAYS = [1, 2, 3, 5, 10]; // keep in sync with DELAYS in main.js

  // last-used delay is the split button's default, remembered across runs
  let delay = Number(localStorage.getItem('delay-seconds'));
  if (!DELAYS.includes(delay)) delay = 1;

  const menu = document.getElementById('delay-menu');
  const mainBtn = document.getElementById('delay-main');

  function renderDelay() {
    mainBtn.textContent = `After ${delay}s`;
    menu.innerHTML = '';
    for (const s of DELAYS) {
      const item = document.createElement('button');
      item.setAttribute('role', 'menuitem');
      item.textContent = `${s} second${s === 1 ? '' : 's'}`;
      if (s === delay) item.classList.add('current');
      item.addEventListener('click', () => {
        delay = s;
        localStorage.setItem('delay-seconds', String(s));
        renderDelay();
        menu.hidden = true;
        ipcRenderer.send('start-capture-delayed', s);
      });
      menu.appendChild(item);
    }
  }
  renderDelay();

  document.getElementById('capture').addEventListener('click', () => {
    ipcRenderer.send('start-capture');
  });
  mainBtn.addEventListener('click', () => {
    ipcRenderer.send('start-capture-delayed', delay);
  });
  document.getElementById('delay-toggle').addEventListener('click', (e) => {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
  });
  // any click outside the menu (or Esc) dismisses it
  document.addEventListener('click', (e) => {
    if (!menu.hidden && !menu.contains(e.target)) menu.hidden = true;
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') menu.hidden = true;
  });
  document.getElementById('countdown-cancel').addEventListener('click', () => {
    ipcRenderer.send('cancel-delayed-capture');
  });
  // main broadcasts the remaining seconds once per second; 0 means no delay
  // is pending (fired or cancelled) — show the capture buttons again
  ipcRenderer.on('delay-tick', (e, remaining) => {
    const pending = remaining > 0;
    document.getElementById('capture-row').hidden = pending;
    document.getElementById('countdown').hidden = !pending;
    if (pending) {
      menu.hidden = true;
      document.getElementById('countdown-text').textContent = `Capturing in ${remaining}s…`;
    }
  });
</script>
</body>
</html>
